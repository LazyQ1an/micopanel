services:
  agent:
    image: ghcr.io/lazyq1an/micopanel-agent:latest
    restart: unless-stopped
    environment:
      CONTROLLER_URL: ${CONTROLLER_URL:?Set the public panel URL, e.g. https://panel.example.com}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?Create a node in MicoPanel first}
      NODE_NAME: ${NODE_NAME:-minecraft-node}
      DOCKER_SOCKET: /var/run/docker.sock
      DATA_ROOT: /var/lib/micopanel
      # Optional S3/MinIO backup target. Set all four variables together.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - micopanel-node-data:/var/lib/micopanel

volumes:
  micopanel-node-data:
