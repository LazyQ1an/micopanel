services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-micopanel}
      POSTGRES_USER: ${POSTGRES_USER:-micopanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      ARTIFACTS_DIR: /var/lib/micopanel/artifacts
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-1073741824}
      ARTIFACT_TOKEN_TTL_MINUTES: ${ARTIFACT_TOKEN_TTL_MINUTES:-60}
      FILE_TRANSFERS_DIR: /var/lib/micopanel/file-transfers
      FILE_TRANSFER_MAX_BYTES: ${FILE_TRANSFER_MAX_BYTES:-1073741824}
      FILE_TRANSFER_TOKEN_TTL_MINUTES: ${FILE_TRANSFER_TOKEN_TTL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-artifacts:/var/lib/micopanel/artifacts
      - api-file-transfers:/var/lib/micopanel/file-transfers

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  api-artifacts:
  api-file-transfers:
